function currentSeason(d = new Date()) {
  const m = d.getMonth();
  return SEASONS.find(s => s.months.includes(m)) || SEASONS[3];
}

/* ============================== ANALIZĂ ============================== */

function analyze(p) {
  const bmi = p.weight / Math.pow(p.height / 100, 2);
  let bmiLabel = bmi < 18.5 ? "subponderal" : bmi < 25 ? "normal" : bmi < 30 ? "supraponderal" : "obesitate";
  const waist = parseFloat(p.waist);
  const whtr = (!isNaN(waist) && waist > 50 && waist < 200 && p.height > 100) ? waist / p.height : null;
  /* --- grăsime corporală declarată (mult mai relevantă decât IMC) --- */
  const bf = parseFloat(p.bodyFat);
  const fSex = p.sex === "f";
  let fatLabel = null;
  if (!isNaN(bf) && bf > 3 && bf < 65) {
    fatLabel = bf < (fSex ? 14 : 6) ? "grăsime foarte puțină" : bf < (fSex ? 21 : 14) ? "compoziție atletică" : bf < (fSex ? 25 : 18) ? "grăsime în interval normal" : bf < (fSex ? 32 : 25) ? "grăsime peste medie" : "adipozitate";
  }
  /* --- „greu dar nu gras": mușchi, nu grăsime --- */
  const leanBuild = (fatLabel && bf < (fSex ? 18 : 14) && bmi >= 25) || (p.appearance === "fit" && bmi >= 25 && whtr != null && whtr < 0.5);
  const muscular = leanBuild;
  if (leanBuild) bmiLabel = "IMC mare — masă musculară, nu adipozitate";
  else if (fatLabel) bmiLabel = fatLabel;
  else if (bmi < 25 && whtr != null && whtr >= 0.53) bmiLabel = "IMC „normal”, dar talie relativ mare";
  else if (bmi >= 25 && whtr != null && whtr < 0.5) bmiLabel = "IMC peste 25, dar distribuție sănătoasă";

  /* --- constituții TCM --- */
  const pt = { spleenQi: 0, kidneyYang: 0, kidneyYin: 0, liverQi: 0, liverFire: 0, heartBlood: 0, heartYin: 0, lungQi: 0, damp: 0, bloodStasis: 0, stomachYin: 0 };
  const A = (k, v) => { pt[k] += v; };
  // semne directe
  if (p.temp === "cold") { A("kidneyYang", 2); A("spleenQi", 1); }
  if (p.temp === "hot") { A("liverFire", 2); A("kidneyYin", 1); }
  if (p.temp === "mixed") { A("kidneyYin", 2); A("liverFire", 1); } // foc flotant
  // limbă corp
  if (p.tongueBody === "pale") { A("spleenQi", 2); A("heartBlood", 1); }
  if (p.tongueBody === "red") { A("kidneyYin", 2); A("liverFire", 1); A("heartYin", 1); }
  if (p.tongueBody === "crimson") A("bloodStasis", 3);
  if (p.tongueBody === "swollen") { A("damp", 2); A("spleenQi", 2); }
  // limbă depozit
  if (p.tongueCoat === "thick") { A("damp", 3); A("spleenQi", 1); }
  if (p.tongueCoat === "yellow") { A("liverFire", 2); A("damp", 1); }
  if (p.tongueCoat === "dry") A("stomachYin", 2);
  if (p.tongueCoat === "none") { A("kidneyYin", 2); A("stomachYin", 1); }
  // sete
  if (p.thirst === "littleWarm") A("spleenQi", 1);
  if (p.thirst === "muchCold") { A("kidneyYin", 1); A("liverFire", 1); }
  if (p.thirst === "night") { A("kidneyYin", 2); A("kidneyYang", 1); }
  // scaun
  if (p.stool === "loose") { A("spleenQi", 2); A("damp", 1); }
  if (p.stool === "dry") { A("stomachYin", 2); A("bloodStasis", 1); }
  if (p.stool === "urgent") { A("liverFire", 2); A("damp", 1); }
  if (p.stool === "thin") { A("spleenQi", 2); A("lungQi", 1); }
  if (p.stool === "greasy") { A("damp", 2); A("spleenQi", 1); }
  // frecvența tranzitului
  if (p.stoolFreq === "every2") { A("liverQi", 1); A("spleenQi", 1); }
  if (p.stoolFreq === "rare") { A("bloodStasis", 1); A("stomachYin", 1); A("liverQi", 1); }
  if (p.stoolFreq === "alternating") { A("liverQi", 2); }
  // transpir
  if (p.sweat === "little") A("lungQi", 1);
  if (p.sweat === "profuse") A("lungQi", 2);
  if (p.sweat === "nightOnly") { A("kidneyYin", 2); }
  // somn
  if (p.sleep === "fallHard") { A("liverQi", 1); A("heartBlood", 1); }
  if (p.sleep === "wake13") { A("liverQi", 3); A("bloodStasis", 1); }
  if (p.sleep === "wake35") { A("lungQi", 2); }
  // emoție
  if (p.emotion === "flat") { A("spleenQi", 1); A("heartBlood", 1); }
  if (p.emotion === "irritable") { A("liverQi", 2); A("liverFire", 1); }
  if (p.emotion === "anxious") { A("heartYin", 2); A("heartBlood", 1); }
  if (p.emotion === "apathic") A("kidneyYang", 2);
  // durere
  if (p.pain === "dullFixed") { A("bloodStasis", 2); A("kidneyYang", 1); }
  if (p.pain === "wandering") A("liverQi", 2);
  if (p.pain === "burning") A("liverFire", 2);
  // digestie crud
  if (p.digestionRaw === "bad") { A("spleenQi", 2); }
  if (p.digestionRaw === "craving") { A("damp", 1); A("spleenQi", 1); }
  // energie
  if (p.energy === "low") { A("spleenQi", 2); A("kidneyYang", 2); }
  if (p.energy === "wired") { A("kidneyYin", 2); A("heartYin", 1); }
  // examen fizic auto
  if (p.sublingual === "dark") A("bloodStasis", 2);
  if (p.sublingual === "varicose") A("bloodStasis", 4);
  for (const tId of (p.tender || [])) { const it = EXAM.tender.find(x => x.id === tId); if (it) for (const [k, v] of Object.entries(it.pt)) A(k, v); }
  const fd = EXAM.fatDist.find(x => x.id === p.fatDist); if (fd) for (const [k, v] of Object.entries(fd.pt)) A(k, v);
  const cx = EXAM.complexion.find(x => x.id === p.complexion); if (cx) for (const [k, v] of Object.entries(cx.pt)) A(k, v);
  for (const eId of (p.eyesNails || [])) { const it = EXAM.eyesNails.find(x => x.id === eId); if (it) for (const [k, v] of Object.entries(it.pt)) A(k, v); }
  for (const zId of (p.skinZones || [])) { const it = EXAM.skinZones.find(x => x.id === zId); if (it) for (const [k, v] of Object.entries(it.pt)) A(k, v); }
  for (const mId of (p.skinMarks || [])) { const it = EXAM.skinMarks.find(x => x.id === mId); if (it) for (const [k, v] of Object.entries(it.pt)) A(k, v); }
  for (const cId of (p.conditions || [])) { const it = CONDITIONS.find(x => x.id === cId); if (it) for (const [k, v] of Object.entries(it.pt)) A(k, v); }
  // gust în gură dimineața
  if (p.morningTaste === "bitter") { A("liverFire", 2); A("liverQi", 1); }
  if (p.morningTaste === "sweet") { A("damp", 2); A("spleenQi", 1); }
  if (p.morningTaste === "sour") { A("liverQi", 2); A("liverFire", 1); }
  if (p.morningTaste === "salty") { A("kidneyYin", 1); A("kidneyYang", 1); }
  if (p.morningTaste === "flat") { A("damp", 1); A("spleenQi", 1); }
  if (p.stairs === "hard") { A("spleenQi", 1); A("lungQi", 1); }
  if (p.stairs === "very") { A("kidneyYang", 1); A("lungQi", 2); A("heartBlood", 1); }
  // simptome
  const map = [
    ["Oboseală persistentă", { spleenQi: 1, kidneyYang: 1 }],
    ["Mâini/picioare reci", { kidneyYang: 1 }],
    ["Senzație de căldură după-amiaza/seara", { kidneyYin: 2 }],
    ["Transpirații nocturne", { kidneyYin: 2 }],
    ["Fălcii roșii", { kidneyYin: 1 }],
    ["Frig interior (abdomen/spate rece)", { kidneyYang: 2, spleenQi: 1 }],
    ["Balonare / digestie lentă", { spleenQi: 1, damp: 1 }],
    ["Tranzit moale / nestatornic", { spleenQi: 1 }],
    ["Constipație uscată", { stomachYin: 1 }],
    ["Gaze după leguminoase", { spleenQi: 1 }],
    ["Disconfort după alimente crude", { spleenQi: 2 }],
    ["Poftă de dulce", { spleenQi: 1 }],
    ["Foame puternică + slăbiciune dacă nu mănânc", { stomachYin: 1, bloodSugar: 0 }],
    ["Somn neodihnitor", { heartBlood: 1 }],
    ["Trezește între 1–3 noaptea", { liverQi: 2 }],
    ["Trezește între 3–5 dimineața", { lungQi: 1 }],
    ["Anxietate / agitație", { heartYin: 1 }],
    ["Depresie / dispoziție joasă", { liverQi: 1, heartBlood: 1 }],
    ["Iritabilitate / furie ușoară", { liverQi: 1, liverFire: 1 }],
    ["Dificultăți de concentrare", { heartBlood: 1, damp: 1 }],
    ["Somnolență frecventă / pesantă", { damp: 1 }],
    ["Cicl menstrual dureros / cheaguri", { bloodStasis: 2, liverQi: 1 }],
    ["Chisturi mamare / fibroame uterine diagnosticate", { damp: 1, bloodStasis: 1, liverQi: 1 }],
    ["Sâni sensibili înainte de ciclu (SPM)", { liverQi: 2 }],
    ["Retenție de apă / edeme", { damp: 2, spleenQi: 1 }],
    ["Libido scăzut", { kidneyYang: 2 }],
    ["Căderea părului", { kidneyYin: 1, kidneyYang: 1 }],
    ["Piele uscată / mată", { kidneyYin: 1, bloodStasis: 1 }],
    ["Umflături ganglionare frecvente", { damp: 1, lungQi: 1 }],
    ["Dureri articulare / rigiditate matinală", { bloodStasis: 1, damp: 1 }],
    ["Crăpături la colțuri / buze uscate", { stomachYin: 1 }],
    ["Amețeală la ridicare", { heartBlood: 1, bloodSugar: 0 }],
    ["Palpitații", { heartBlood: 1, heartYin: 1 }],
    ["Tremur/agitație dacă trec multe ore fără mâncare", { bloodSugar: 0 }],
    ["Somnolență puternică după masă", { spleenQi: 2, damp: 1 }],
    ["Creștere în greutate ușoară", { damp: 1 }],
    ["Senzație de „ceață“ mentală", { damp: 2 }],
    ["Căldură în tălpi/palme seara („cinci focuri”)", { kidneyYin: 2, heartYin: 1 }],
    ["Zgârieturi/amețeală în camere închise sau la căldură", { damp: 1, spleenQi: 1 }],
    ["Sete persistentă cu gură uscată", { stomachYin: 2, kidneyYin: 1 }],
    ["Îmi trebuie cafea ca să „pornește motorul”", { kidneyYang: 1, spleenQi: 1 }],
    ["Arsuri / reflux gastric", { liverFire: 1, damp: 1 }],
    ["Greață dimineața sau „pe stomacul gol”", { damp: 2, spleenQi: 1 }],
    ["Abdomen umflat în a doua parte a zilei", { damp: 1, spleenQi: 1 }],
    ["Mâncare nedigerată vizibilă în scaun", { spleenQi: 3 }],
    ["Alimente grase greu tolerate (greutate sub coasta dreaptă)", { damp: 2, liverQi: 1 }],
    ["Adorm instant, dar treziri dese", { heartYin: 1, heartBlood: 1 }],
    ["Vise intense / coșmaruri", { heartYin: 1, liverFire: 1 }],
    ["Mă trezesc cu inima accelerată", { heartYin: 1, kidneyYin: 1 }],
    ["Acnee la bărbie / maxilar", { liverFire: 1, damp: 1 }],
    ["Pofte de sare sau acre", { kidneyYang: 1 }],
    ["Crize de transpirație cu palpitații", { heartYin: 1, kidneyYin: 1 }],
    ["Foame la 1–2 ore după masă", { spleenQi: 1 }],
    ["Puls rapid în repaus", { heartYin: 1 }],
    ["Mâini ușor tremurânde seara", { kidneyYin: 1, bloodSugar: 0 }],
  ];
  for (const s of p.symptoms) { const hit = map.find(m => m[0] === s); if (hit) for (const [k, v] of Object.entries(hit[1])) { if (!(k in pt)) continue; A(k, v); } }
  if (p.appearance === "overweight" || p.appearance === "obese") { A("damp", 2); }
  if (p.appearance === "thin") { A("spleenQi", 1); A("stomachYin", 1); }

  const maxPt = Math.max(...Object.values(pt), 1);
  const ptNorm = Object.fromEntries(Object.entries(pt).map(([k, v]) => [k, Math.round(v / maxPt * 100)]));
  const ranked = Object.entries(pt).sort((a, b) => b[1] - a[1]);
  const dominant = ranked[0][1] >= 2 ? ranked[0][0] : null;
  const secondary = ranked[1][1] >= 2 ? ranked[1][0] : null;
  const dominantScore = ranked[0][1];

  /* --- axe Peat --- */
  const axBase = { thyroid: 100, cortisol: 100, estrogen: 100, bloodSugar: 100, inflammation: 100, gut: 100 };
  const axes = { ...axBase };
  const axisHits = {};
  for (const h of PEAT_HABITS) {
    if (!p.habits.includes(h.id)) continue;
    for (const [k, v] of Object.entries(h.axis)) { axes[k] -= v * 8; (axisHits[k] = axisHits[k] || []).push(h.label); }
  }
  const sMap = [
    ["Mâini/picioare reci", { thyroid: 6 }], ["Oboseală persistentă", { thyroid: 5 }], ["Libido scăzut", { thyroid: 5 }],
    ["Căderea părului", { thyroid: 4 }], ["Creștere în greutate ușoară", { thyroid: 4 }],
    ["Retenție de apă / edeme", { estrogen: 8 }], ["Sâni sensibili înainte de ciclu (SPM)", { estrogen: 10 }],
    ["Cicl menstrual dureros / cheaguri", { estrogen: 5 }], ["Umflături ganglionare frecvente", { estrogen: 4 }],
    ["Trezește între 1–3 noaptea", { cortisol: 5 }], ["Anxietate / agitație", { cortisol: 4 }],
    ["Tremur/agitație dacă trec multe ore fără mâncare", { bloodSugar: 10 }],
    ["Foame puternică + slăbiciune dacă nu mănânc", { bloodSugar: 8 }],
    ["Somnolență puternică după masă", { bloodSugar: 5 }],
    ["Amețeală la ridicare", { bloodSugar: 4 }],
    ["Dureri articulare / rigiditate matinală", { inflammation: 8 }],
    ["Piele uscată / mată", { inflammation: 3 }],
    ["Balonare / digestie lentă", { gut: 6 }], ["Tranzit moale / nestatornic", { gut: 5 }],
    ["Gaze după leguminoase", { gut: 5 }], ["Disconfort după alimente crude", { gut: 3 }],
    ["Constipație uscată", { gut: 3 }],
    ["Arsuri / reflux gastric", { gut: 4 }],
    ["Greață dimineața sau „pe stomacul gol”", { gut: 3 }],
    ["Abdomen umflat în a doua parte a zilei", { gut: 4 }],
    ["Mâncare nedigerată vizibilă în scaun", { gut: 6, thyroid: 4 }],
    ["Sete persistentă cu gură uscată", { inflammation: 3 }],
    ["Acnee la bărbie / maxilar", { estrogen: 5 }],
    ["Crize de transpirație cu palpitații", { cortisol: 5 }],
    ["Mă trezesc cu inima accelerată", { cortisol: 4 }],
    ["Puls rapid în repaus", { cortisol: 4 }],
    ["Mâini ușor tremurânde seara", { bloodSugar: 4 }],
    ["Foame la 1–2 ore după masă", { bloodSugar: 6 }],
  ];
  for (const s of p.symptoms) { const hit = sMap.find(m => m[0] === s); if (hit) for (const [k, v] of Object.entries(hit[1])) { axes[k] -= v; (axisHits[k] = axisHits[k] || []).push(s); } }
  /* tiroidă — evaluare aprofundată (Peat: TSH > 2 = semnal de alertă) */
  const thHits = [];
  if (p.tsh === "hypo") { axes.thyroid -= 45; thHits.push("hipotiroidism diagnosticat"); }
  if (p.tsh === "hashi") { axes.thyroid -= 50; thHits.push("Hashimoto — tiroidită autoimună"); }
  if (p.tsh === "high") { axes.thyroid -= 22; thHits.push("TSH 2–4 — Peat consideră orice peste 2 problematic"); }
  if (p.tsh === "vhigh") { axes.thyroid -= 35; thHits.push("TSH peste 4 — net supranormal"); }
  const mt = parseFloat(p.morningTemp);
  if (!isNaN(mt) && mt >= 33 && mt < 36.3) { axes.thyroid -= Math.round((36.3 - mt) * 12); thHits.push(`temperatură axilară matinală ${mt}°C — sub 36,3°C sugerează tiroidă joasă (Peat: optim > 36,5°C)`); }
  const rp = parseFloat(p.restingPulse);
  if (!isNaN(rp) && rp > 0) {
    if (rp < 58) { axes.thyroid -= 12; thHits.push(`puls de repaus ${rp} bpm — bradicardie metabolică`); }
    if (rp > 85) { axes.cortisol -= 8; thHits.push(`puls de repaus ${rp} bpm — sistem simpatic ridicat`); }
  }
  if (p.stairs === "hard") { axes.thyroid -= 10; thHits.push("toleranță scăzută la efort (scări grele la 1–2 etaje)"); }
  if (p.stairs === "very") { axes.thyroid -= 16; thHits.push("intoleranță marcată la efort"); }
  if ((p.eyesNails || []).includes("eyebrows")) { axes.thyroid -= 12; thHits.push("sprâncene rare în treimea externă — semnul Hertoghe de hipotiroidism"); }
  if ((p.eyesNails || []).includes("coldHands")) { axes.thyroid -= 6; thHits.push("mâini albastre la frig — circulație periferică slabă"); }
  if (p.symptoms.includes("Constipație uscată")) { axes.thyroid -= 6; thHits.push("constipație — tranzitul încetinește la tiroidă joasă"); }
  for (const h of thHits) (axisHits.thyroid = axisHits.thyroid || []).push(h);
  /* estrogen — status hormonal feminin */
  if (p.sex === "f") {
    if (p.menopause === "meno" || p.menopause === "post") { axes.estrogen -= 28; (axisHits.estrogen = axisHits.estrogen || []).push("menopauză: progesteronul cade spre zero, estrogenul rămâne relativ dominant („estrogen neopus“)"); }
    if (p.menopause === "peri") { axes.estrogen -= 15; (axisHits.estrogen = axisHits.estrogen || []).push("peri-menopauză: anovulație frecventă → fără corp galben → fără progesteron"); }
    if (p.menopause === "irregular") { axes.estrogen -= 8; (axisHits.estrogen = axisHits.estrogen || []).push("ciclu neregulat — posibil anovulator"); }
  }
  if (p.symptoms.includes("Chisturi mamare / fibroame uterine diagnosticate")) { axes.estrogen -= 15; (axisHits.estrogen = axisHits.estrogen || []).push("chisturi/fibroame — proliferare tipic estrogenică"); }
  /* tranzit rar — intestin + tiroidă (Peat: tranzitul lent acompaniază metabolismul lent) */
  if (p.stoolFreq === "every2") { axes.gut -= 5; axes.thyroid -= 5; (axisHits.gut = axisHits.gut || []).push("scaun la 2–3 zile — tranzit lent"); }
  if (p.stoolFreq === "rare") { axes.gut -= 10; axes.thyroid -= 8; (axisHits.gut = axisHits.gut || []).push("scaun mai rar de o dată la 3 zile — constipație marcată"); (axisHits.thyroid = axisHits.thyroid || []).push("constipație marcată — tranzitul încetinește la tiroidă joasă"); }
  if (p.stoolFreq === "alternating") { axes.gut -= 6; (axisHits.gut = axisHits.gut || []).push("tranzit alternant — tipar de stagnare"); }
  if (p.stool === "greasy") { axes.gut -= 5; (axisHits.gut = axisHits.gut || []).push("scaun grunjos/mirositor — absorbție slabă, dezechilibru de flotă"); }
  /* semne cutanate pe zone & mărci — efect pe axe */
  for (const zId of (p.skinZones || [])) { const it = EXAM.skinZones.find(x => x.id === zId); if (it) for (const [k, v] of Object.entries(it.ax)) { axes[k] -= v; if (it.hit) (axisHits[k] = axisHits[k] || []).push(it.hit); } }
  for (const mId of (p.skinMarks || [])) { const it = EXAM.skinMarks.find(x => x.id === mId); if (it) for (const [k, v] of Object.entries(it.ax)) { axes[k] -= v; if (it.hit) (axisHits[k] = axisHits[k] || []).push(it.hit); } }
  for (const cId of (p.conditions || [])) { const it = CONDITIONS.find(x => x.id === cId); if (it) for (const [k, v] of Object.entries(it.ax)) { axes[k] -= v; (axisHits[k] = axisHits[k] || []).push(it.hit); } }
  for (const k of Object.keys(axes)) axes[k] = Math.max(5, Math.min(100, Math.round(axes[k])));
  const metabolicScore = Math.round((axes.thyroid * 0.3 + axes.cortisol * 0.2 + axes.bloodSugar * 0.2 + axes.estrogen * 0.1 + axes.inflammation * 0.1 + axes.gut * 0.1));

  const bmr = Math.round(10 * p.weight + 6.25 * p.height - 5 * p.age + (p.sex === "f" ? -161 : 5));
  const actMult = { sedentary: 1.2, light: 1.4, active: 1.6, veryActive: 1.8 }[p.activity] || 1.3;
  const tdee = Math.round(bmr * actMult);
  const proteinTarget = Math.round(p.weight * (muscular ? 1.8 : bmi >= 25 ? 1.6 : 1.2));
  const carbTarget = Math.round((tdee * 0.55) / 4);
  const fatTarget = Math.round((tdee * 0.25) / 9);

  return { bmi, bmiLabel, whtr, fatLabel, bodyFatPct: (fatLabel ? bf : null), muscular, patterns: pt, ptNorm, dominant, secondary, dominantScore, axes, axisHits, metabolicScore, bmr, tdee, proteinTarget, carbTarget, fatTarget, season: currentSeason() };
}

        {msg && <div className={`mb-4 px-4 py-2 rounded-xl text-sm ${t.chipOn} font-medium`}>{msg}</div>}

        {/* STEP 0 */}
        {step === 0 && (
          <Card t={t}>

            <Field t={t} label="Nume (pentru salvarea profilului)">

            </Field>

                <Chip t={t} on={p.sex === "m"} onClick={() => upd("sex", "m")} label="Masculin" />
                <Chip t={t} on={p.sex === "f"} onClick={() => upd("sex", "f")} label="Feminin" />

/* ---------- helpers de sinteză ---------- */

function shortName(k) {
  const map = { spleenQi: "Qi Splină", kidneyYang: "Yang Rinichi", kidneyYin: "Yin Rinichi", liverQi: "Qi Ficat", liverFire: "Foc Ficat", heartBlood: "Sânge Inimă", heartYin: "Yin Inimă", lungQi: "Qi Plămân", damp: "Umezeală", bloodStasis: "Stază Sânge", stomachYin: "Yin Stomac" };
  return map[k];
}
function maxPt(r) { return Math.max(...Object.values(r.patterns)); }
function weakestAxis(axes) { const es = Object.entries(axes).sort((a, b) => a[1] - b[1]); return es[0][1] >= 80 ? null : es[0][0]; }
function acuFor(r) {
  const sel = Object.entries(r.patterns).sort((a, b) => b[1] - a[1]).filter(([, v]) => v >= 3).map(([k]) => k);
  return sel.length ? sel : (r.dominant ? [r.dominant] : []);
}

function yinYangSummary(r) {
  const yang = r.patterns.spleenQi + r.patterns.kidneyYang + r.patterns.lungQi * 0.5;
  const yin = r.patterns.kidneyYin + r.patterns.stomachYin + r.patterns.heartYin;
  const heat = r.patterns.liverFire + r.patterns.damp;
  let out = [];
  if (yang > yin + 2) out.push("Profil predominant <b>Yang-deficient</b> (frig, oboseală): tot protocolul se construiește pe căldură — alimente gătite calde, ghimbir, miere, masă regulată. Regula de aur: „gătit & cald“.");
  else if (yin > yang + 2) out.push("Profil predominant <b>Yin-deficient</b> (uscare, căldură vidă): hrănește lichidele — gelatină, bulion, pere coapte, lapte cald, somn înainte de 23:00. Evită condimentele fierbinți în exces.");
  else out.push("Echilibru relativ Yin/Yang pe fond general — prioritizează tiparul dominant din radar.");
  if (heat >= 4) out.push("Componentă de <b>Căldură/Umezeală</b> prezentă: nu aplica orbește tonifieri Yang (ginseng!) — curăță mai întâi (mentă, ceai verde slab dimineața, reduce zahărul+grăsime combinate).");
  if (r.patterns.bloodStasis >= 3) out.push("Stază de Sânge marcată: mișcare zilnică blândă + condimente care mișcă sângele; la femei, urmărirea ciclului e indicatorul cheie.");
  return out.map((x, i) => <p key={i} className="text-sm mb-2" dangerouslySetInnerHTML={{ __html: x }} />);
}

function tcmRules(r) {
  const rules = [];
  if (r.patterns.spleenQi >= 2) rules.push("Splină: mese calde, gătite, la ore fixe; niciodată mâncatul în grabă sau sub stres; ghimbir în ceai dimineața.");
  if (r.patterns.kidneyYang >= 2) rules.push("Rinichi-Yang: acoperă lombarul, evită frigul prelungit, supă de oase cu scorțișoară; somn înainte de 23:00.");
  if (r.patterns.kidneyYin >= 2) rules.push("Rinichi-Yin: culcare devreme (orele 23:00 = pivotul Yin-ului), gelatină/bulion, evită cafeaua după prânz.");
  if (r.patterns.liverQi >= 2) rules.push("Ficat-Qi: mișcare aer liber zilnic, respirații în natură; redu alcoolul; exprimă frustrarea (jurnal, vorbit) înainte de masă.");
  if (r.patterns.liverFire >= 2) rules.push("Foc de Ficat: redu cafeaua/alcoolul/condimentele fierbinți; mentă, chrysanthemum; nu mânca enervat.");
  if (r.patterns.heartBlood >= 2 || r.patterns.heartYin >= 2) rules.push("Inimă: rutină de seara liniștită, lapte cald cu miere, fără ecrane 1h înainte de culcare.");
  if (r.patterns.lungQi >= 2) rules.push("Plămân: respirații profunde dimineața, gât acoperit la vânt, miere mică doze.");
  if (r.patterns.damp >= 3) rules.push("Umezeală: 10 min plimbare după fiecare masă, redu lactatele procesate și zahărul+grăsime combinate; orez cu ghimbir.");
  if (r.patterns.bloodStasis >= 3) rules.push("Stază: plimbări + qigong zilnic; adaugă puțin ghimbir/scorțișoară la mese; Evită sedentarismul prelungit.");
  if (r.patterns.stomachYin >= 2) rules.push("Stomac-Yin: mese mici și dese, supe-gelatină, pere coapte; evită alimente foarte uscate.");
  if (rules.length === 0) rules.push("Tipare discrete — menține mese regulate, somn bun și mișcare zilnică; re-evaluează la schimbarea anotimpului.");
  return rules.slice(0, 7);
}

function seasonAdjust(r) {
  const out = [];
  const s = r.season;
  const seasonConflict = {
    spring: "Primăvara + Foc de Ficat: evită „curele“ agresive; la Spleen slab, verdeturile se gătesc.",
    summer: "Vara + Yang/Rinichi deficitar: NU exagera cu băuturile reci chiar dacă e cald — ele lovesc exact punctul tău slab.",
    earth: "Sezonul de Pământ + Spleen slab: e momentul TAU de reechilibrare — 2–3 săptămâni de discipline alimentară au efect maxim acum.",
    autumn: "Toamna + Yin deficitar: pielea/gâtul uscat se agravează — dublează gelatina, pere coapte, miere; Plămân & Colon: hidratare activă.",
    winter: "Iarna + tipar rece (Yang defic): sezonul cel mai delicat pentru tine — ZERO alimente crude/rece, supă de oase zilnic, lombar cald.",
  };
  out.push(seasonConflict[s.id]);
  if (r.patterns.damp >= 3 && (s.id === "earth" || s.id === "winter")) out.push("Umezeala ta se agravează în anotimpurile umede/grea: redu lactatele și fructele pe stomacul gol în această perioadă, crește ghimbir.");
  if (r.patterns.kidneyYin >= 3 && s.id === "summer") out.push("Yin-deficiență + vară: protejează lichidele — lapte cald, pepene în doze mici, siestă, evită transpirarea excesivă.");
  if (r.patterns.kidneyYang >= 3 && (s.id === "winter" || s.id === "autumn")) out.push("Yang-deficiență + sezon rece: acesta e „sezonul de risc“ pentru tine — încălzește fiecare masă, adaugă scorțișoară mică doze, nu lăsa foamea să se instaleze.");
  if (r.patterns.liverFire >= 3 && s.id === "spring") out.push("Foc de Ficat + primăvară (sezonul Ficatului): riscul de iritabilitate/explozie e maxim — mentă, plimbări, somn devreme.");
  return out;
}

function planFor(p, r) {
  const plan = [];
  if (p.habits.includes("pufa")) plan.push("Pasul 1, impact maxim: elimină uleiurile de semințe — înlocuiește cu unt, cocos, măsline. Acest singur pas deblochează tiroida și inflamația în 2–3 luni.");
  if (p.habits.includes("fasting") || p.habits.includes("undereating")) plan.push("Stop post/skipping: mic dejun cu proteine + carbohidrați în max 1h de la trezire; la 3–4h mese mici cu proteine.");
  if (r.patterns.spleenQi >= 2) plan.push("Construiește „focul digestiv“: 2 săptămâni doar mâncare caldă, gătită, cu ghimbir — reface Spleen-ul mai repede decât orice supliment.");
  if (r.axes.cortisol < 70) plan.push("Protocolul anti-cortizol: lumină naturală dimineața, lapte cald + miere înainte de culcare (triptofan + calciu), respirație 4-7-8, plimbare fără telefon.");
  if (r.axes.thyroid < 70) plan.push("Sprijin tiroidian: fructe zilnic (potasiu), seleniu + zinc, vitamină A; monitorizează temperatura axilară; dacă stagnează, cere analize tiroidiene complete (TSH, fT3, fT4, rt3, anticorpi).");
  if (r.axes.bloodSugar < 70) plan.push("Stabilitate glicemică: nu combina carbohidrați goi cu grăsimi masive; adaugă proteine/gelatină la fiecare masă; miere în loc de sirop.");
  if (r.axes.gut < 70) plan.push("Intestin: gelatină zilnic + bulion; fructe coapte; probiotice în doze mici crescătoare; exclude temporar leguminoasele.");
  if (r.patterns.kidneyYin >= 2) plan.push("Yin-ul tău se repară NOAPTEA: culcarea la 23:00 e non-negociabilă — gelatină + lapte cald seara accelerează refacerea.");
  if (r.patterns.kidneyYang >= 2) plan.push("Yang-ul tău se repară DIMINEAȚA: soare/prima masă caldă cât mai devreme, supă de oase cu ghimbir.");
  if (p.habits.includes("cardio")) plan.push("Înlocuiește cardio prelungit: forță scurtă 2–3×/săpt + plimbări zilnice — protejează mușchiul și tiroida.");
  if (r.bmi >= 25) plan.push(`Greutate: mic deficit blând (~${Math.max(1500, r.tdee - 300)} kcal) cu proteine ${r.proteinTarget}g — FĂRĂ înfometare, care la tiparul tău scade metabolismul și crește Damp-ul.`);
  if (r.bmi < 18.5) plan.push(`Refacere: ~${r.tdee + 300} kcal/zi dense (lapte, ouă, gelatină, cartopi) + somn lung; nu cardio.`);
  if (plan.length === 0) plan.push("Menține: mese regulate cu proteine + carbohidrați de calitate, somn 7–9h, lumină naturală zilnic, gelatină/bulion de bază.");
  return plan.slice(0, 9);
}

function dayMenu(p, r) {
  const cold = r.patterns.kidneyYang >= 2 || r.patterns.spleenQi >= 3;
  const dry = r.patterns.kidneyYin >= 2 || r.patterns.stomachYin >= 2;
  const damp = r.patterns.damp >= 3;
  return [
    { m: "☀️ Dimineața (trezire)", x: cold ? "Pahar de apă caldă + zeamă de ghimbir; lumină naturală 10 min. Cafea doar DUPĂ micul dejun." : "Apă la temperatura camerei; lumină naturală. Cafea cu lapte + zahăr după micul dejun." },
    { m: "🥣 Micul dejun", x: cold ? "Ouă gătite în unt + cartofi copți + puțină gelatină în suc de portocale (cald)." : dry ? "Orez cu lapte cald + miere + un ou moale; pere coaptă." : "Ouă + cartofi copți + portocale; cafea cu zahăr și lapte." },
    { m: "🍎 Gustare (3h)", x: damp ? "Fructe coapte (mere la cuptor) — NU crude pe stomacul gol." : "Portocale sau cireșe + puțin cașcaval sau gelatină în suc." },
    { m: "🍲 Prânz (masa cea mai mare)", x: cold ? "Supă de oase cu scorțișoară mică doze + carne în sos cald + orez; legume bine gătite." : dry ? "Bulion cu gelatină + carne fragedă + cartofi piure cu unt; pere coaptă." : "Carne + cartofi copți cu unt + salată mică gătită; fructe." },
    { m: "🫖 Gustare (17:00)", x: "Lapte cald mică doze (dacă tolerezi) sau ceai de mușețel cu miere; 2–3 nuci max dacă vrei." },
    { m: "🌙 Cină (ultima masă 2–3h înainte de culcare)", x: "Ușoară: bulion + gelatină, cartopi mici doze, pește alb sau ouă; " + (cold ? "NU salată crudă." : "salată mică ok.") },
    { m: "😴 Înainte de somn", x: (r.axes.cortisol < 75 || dry) ? "Lapte cald cu miere + o prafă de sare — triptofan + calciu, scade cortizolul seric." : "Ceai de mentă/mușețel; respir 4-7-8; fără ecrane 1h." },
  ];
}
